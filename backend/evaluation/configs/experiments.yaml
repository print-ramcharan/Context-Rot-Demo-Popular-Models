# Reproducible BEIR retrieval benchmark configuration.
# Every run records this file's SHA-256, the Git commit and dataset checksums.

datasets:
  - scifact
  - nfcorpus

# Match the production structure-aware word chunker.
chunking:
  chunk_size: 350
  overlap: 50

# Match the application embedding model and query instruction.
embedding:
  model_name: "BAAI/bge-base-en-v1.5"
  device: "cpu"
  query_instruction: "Represent this sentence for searching relevant passages: "

retrieval:
  mode: "hybrid"
  candidate_pool_size: 100
  evaluation_depth: 20
  top_k: 100
  dense_k: 100
  bm25_k: 100
  alpha: 0.5
  similarity_threshold: 0.0
  rerank_enabled: true
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_candidate_pool: 100
  rerank_top_n: 20
  query_cache_ttl_s: 300
  query_cache_max_items: 10000

index:
  type: "cosine"

latency:
  # Quality is evaluated on every official test query. Repeated timings use a
  # deterministic sample to avoid multiplying the full reranking workload.
  sample_size: 30
  repeats: 3

results:
  raw: "backend/evaluation/results/raw"
  processed: "backend/evaluation/results/processed"
  tables: "backend/evaluation/results/tables"

seed: 42
