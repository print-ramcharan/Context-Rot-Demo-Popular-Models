# Experiments configuration for the IEEE IEEE-revison retrieval evaluation.
# Commit + sha256 of this file must be recorded for every experiment run.

datasets:
  - scifact
  - nfcorpus

# Chunking used to convert BEIR documents into retrieval chunks.
chunking:
  chunk_size: 400
  overlap: 80

# Dense embedding model used for evaluation.
embedding:
  model_name: "all-MiniLM-L6-v2"
  device: "cpu"

# Shared retrieval hyperparameters (match backend/config.yaml).
retrieval:
  mode: "hybrid"
  candidate_pool_size: 100
  evaluation_depth: 20
  top_k: 100
  dense_k: 100
  bm25_k: 100
  alpha: 0.5
  similarity_threshold: 0.05
  rerank_enabled: true
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_candidate_pool: 100
  rerank_top_n: 20
  query_cache_ttl_s: 300
  query_cache_max_items: 10000

# Index type must match the production FAISS mode (cosine / IndexFlatIP).
index:
  type: "cosine"

# Output directories.
results:
  raw: "backend/evaluation/results/raw"
  processed: "backend/evaluation/results/processed"
  tables: "backend/evaluation/results/tables"

# Deterministic seed for bootstrap/resampling.
seed: 42
