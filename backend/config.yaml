chunking:
  # Word-count approximation; boundaries preserve headings and paragraphs.
  chunk_size: 350
  overlap: 50

embedding:
  # BGE-base is a practical CPU/MPS model for an 8 GB Mac.
  # Qwen/Qwen3-Embedding-0.6B can be selected after checking local memory.
  model_name: "BAAI/bge-base-en-v1.5"
  device: "mps"
  query_instruction: "Represent this sentence for searching relevant passages: "
  cache_path: "cache/embeddings.sqlite"
  cache_max_items: 200000
  cache_enabled: true

retrieval:
  mode: "hybrid"
  top_k: 12
  similarity_threshold: 0.0
  dense_k: 100
  bm25_k: 100
  rrf_k: 60
  rerank_enabled: true
  # Lightweight default; Qwen/Qwen3-Reranker-0.6B is configurable.
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_top_n: 12
  rerank_candidate_pool: 50
  query_cache_ttl_s: 180
  query_cache_max_items: 10000

context:
  compact: false
  max_context_chars: 18000
  max_generation_chars: 5000
  max_sentences: 8
  max_chunks: 12
  require_verification: true

storage:
  index_path: "memory_index"
  index_type: "cosine"
  auto_load: true

llm:
  provider: "openrouter"
  openrouter:
    model: "openai/gpt-4o-mini"
    base_url: "https://openrouter.ai/api/v1"
    http_referer: "http://localhost:5173"
    app_name: "Context Rot Lab"
  max_tokens: 700
  temperature: 0.0
  semantic_cache:
    enabled: false
    embedding_model: "all-MiniLM-L6-v2"
    device: "cpu"
    similarity_threshold: 0.92
    ttl_s: 3600
    max_items: 1000
    cache_enabled: false
