chunking:
  # Tuned for shorter word-based chunks to reduce prompt size while preserving overlap.
  chunk_size: 220
  overlap: 30

embedding:
  model_name: "all-MiniLM-L6-v2"
  device: "cpu"
  cache_path: "cache/embeddings.sqlite"
  cache_max_items: 200000
  cache_enabled: true

retrieval:
  mode: "hybrid"
  top_k: 5
  similarity_threshold: 0.1
  dense_k: 30
  bm25_k: 30
  alpha: 0.65
  rerank_enabled: false
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_top_n: 6
  rerank_candidate_pool: 30
  query_cache_ttl_s: 300
  query_cache_max_items: 10000

context:
  compact: true
  max_context_chars: 2600
  max_sentences: 2
  max_chunks: 4

storage:
  index_path: "memory_index"
  index_type: "cosine"
  auto_load: true

llm:
  provider: "gemini"  # Options: "ollama", "huggingface", "anthropic", "openai", "gemini"
  
  # For Ollama (local, no API key needed)
  ollama:
    model: "llama2"  # or "mistral", "phi", "gemma"
    base_url: "http://localhost:11434"
  
  # For HuggingFace (local, no API key needed)
  huggingface:
    model: "mistralai/Mistral-7B-Instruct-v0.2"
    device: "cpu"  # or "cuda" if GPU available
    load_in_8bit: false
  
  # For API-based models (requires API key)
  anthropic:
    model: "claude-sonnet-4-20250514"
    api_key: ""  # Set via environment variable
  
  openai:
    model: "gpt-4"
    api_key: ""  # Set via environment variable
  
  # For Gemini (requires API key)
  gemini:
    model: "gemini-2.5-flash"
    api_key: ""  # Read from GEMINI_API_KEY in .env
  
  # Common parameters
  max_tokens: 1000
  temperature: 0.7

  semantic_cache:
    enabled: false
    embedding_model: "all-MiniLM-L6-v2"
    device: "cpu"
    cache_path: "cache/semantic_embeddings.sqlite"
    cache_max_items: 200000
    cache_enabled: true
    similarity_threshold: 0.92
    ttl_s: 1800
    max_items: 1000
