chunking:
  # Larger chunks keep scenes/paragraphs together so answers don't split across boundaries.
  chunk_size: 400
  overlap: 80

embedding:
  model_name: "all-MiniLM-L6-v2"
  device: "cpu"
  cache_path: "cache/embeddings.sqlite"
  cache_max_items: 200000
  cache_enabled: true

retrieval:
  mode: "hybrid"
  top_k: 20
  similarity_threshold: 0.05
  dense_k: 25
  bm25_k: 25
  alpha: 0.5  # Balanced hybrid retrieval
  rerank_enabled: true
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_top_n: 8
  rerank_candidate_pool: 25
  query_cache_ttl_s: 300
  query_cache_max_items: 10000

context:
  compact: false
  max_context_chars: 12000
  max_sentences: 8
  max_chunks: 10

storage:
  index_path: "memory_index"
  index_type: "cosine"
  auto_load: true

llm:
  provider: "gemini"  # Options: "ollama", "huggingface", "anthropic", "openai", "gemini"
  
  # For Ollama (local, no API key needed)
  ollama:
    model: "llama2"  # or "mistral", "phi", "gemma"
    base_url: "http://localhost:11434"
  
  # For HuggingFace (local, no API key needed)
  huggingface:
    model: "mistralai/Mistral-7B-Instruct-v0.2"
    device: "cpu"  # or "cuda" if GPU available
    load_in_8bit: false
  
  # For API-based models (requires API key)
  anthropic:
    model: "claude-sonnet-4-20250514"
    api_key: ""  # Set via environment variable
  
  openai:
    model: "gpt-4"
    api_key: ""  # Set via environment variable
  
  # For Gemini (requires API key)
  gemini:
    model: "gemini-2.5-flash"
    api_key: ""  # Read from GEMINI_API_KEY in .env
  
  # Common parameters
  max_tokens: 1000
  temperature: 0.7

  semantic_cache:
    enabled: false
    embedding_model: "all-MiniLM-L6-v2"
    device: "cpu"
    similarity_threshold: 0.92
    ttl_s: 3600
    max_items: 1000
    cache_enabled: false
